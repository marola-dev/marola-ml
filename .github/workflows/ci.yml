name: CI

# The devkit's reusable workflows at the pinned tag (MIP-0070 §5.6). Bump the tag here, the
# devkit-ref inputs and flake.nix's input together.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    uses: marola-dev/marola-devkit/.github/workflows/static-ci.yml@v0.14.0
    with:
      hadolint-version: "2.14.0"
      hadolint-files: Dockerfile.local
      shellcheck-files: scripts/*.sh
      extra-commands: |
        git -c advice.detachedHead=false clone -q --depth 1 -b v0.14.0 https://github.com/marola-dev/marola-devkit /tmp/devkit && python3 /tmp/devkit/scripts/docs_lint.py .

  # build_dataset.py and build_dpo_dataset.py read the pinned corpus and resources: fetched first.
  python:
    uses: marola-dev/marola-devkit/.github/workflows/python-ci.yml@v0.14.0
    with:
      ruff-version: "0.16.5"
      self-test-commands: |
        scripts/corpus-fetch.sh --self-test
        scripts/resources-fetch.sh --self-test
        scripts/app-image.sh --self-test
        scripts/benchmark.sh --self-test
        scripts/api-docs.sh --self-test
        scripts/marola-sea-pull.sh --self-test
        python3 scripts/benchmark_gate.py --self-test
        python3 scripts/analyze_training.py --self-test
        python3 finetune/train_lora.py --self-test
        python3 finetune/preflight.py --self-test
        python3 finetune/merge_export.py --self-test
        scripts/corpus-fetch.sh
        scripts/resources-fetch.sh
        python3 finetune/build_dataset.py --self-test
        python3 finetune/build_dpo_dataset.py --self-test

  # No workflow is self-hosted since marola-sea-publish.yml was removed (2026-10-14); this keeps it so.
  runners:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: marola-dev/marola-devkit
          ref: v0.4.1
          path: .tmp/devkit
      - run: python3 .tmp/devkit/scripts/workflow_runners.py .github/workflows

  agents:
    uses: marola-dev/marola-devkit/.github/workflows/agents-check.yml@v0.14.0
    with:
      devkit-ref: v0.14.0

  # Licence and copyright of every file come from REUSE.toml and LICENSES/ (REUSE 3.3).
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: pipx run reuse==5.0.2 lint

  # A called workflow's jobs can never exceed this; only its publish job writes (MIP-0074 §5.2).
  api-docs:
    uses: marola-dev/marola-devkit/.github/workflows/api-docs.yml@v0.14.0
    permissions:
      contents: write
    with:
      devkit-ref: v0.14.0

  # The one check ci-rule requires in every marola repo (marola-dev/marola#813); it must report on
  # every run, so it needs every other job and passes on skipped ones.
  ci-ok:
    if: always()
    needs: [static, python, runners, agents, reuse, api-docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a needed job ended $r"; exit 1 ;; esac
          done
