name: api docs

# pdoc of finetune/ and scripts/, generated by `just api-docs` (MIP-0074 §5.2). A PR run checks the
# generator and commits nothing; a push to main force-pushes the output to the `api-docs` branch.
# release.yml's api-docs.tar.gz release asset is the same generator, kept until task 36.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  api-docs:
    uses: marola-dev/marola-devkit/.github/workflows/api-docs.yml@v0.4.1
    permissions:
      contents: write
    with:
      devkit-ref: v0.4.1
