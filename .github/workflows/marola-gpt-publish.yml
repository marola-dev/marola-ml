# marola-gpt-publish — the one publish workflow of marola-ml (it replaced marola-sea-publish.yml on
# 14 October 2026): the pinned marola-corpus, the dataset, training from random weights on a
# GitHub-hosted CPU, the release directory, then the upload to huggingface.co/h0ffmann/marola-gpt
# (public, MIT; the owner's account for now). It never runs on a merge. The pattern that publishes is a
# pushed tag `marola-gpt-vX.Y.Z` on a commit of main, which `just sea-release` makes (the owner,
# 14 October 2026: "I don't want to publish to hugging face on every merge, I need a pattern"). By
# hand (workflow_dispatch) it is a dry run unless `dry_run` is unticked. An upload cannot be taken
# back; an agent never pushes the tag or dispatches this (AGENTS.md). HF_TOKEN (a fine-grained token
# with write access to that repository) is needed only to upload. The release is MIT
# (docs/adr/0003). It is not kept as a workflow artifact: a release belongs on Hugging Face.
name: marola-gpt publish

on:
  push:
    tags: ["marola-gpt-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "the release version, X.Y.Z (tagged v<version> on Hugging Face); a tag push uses the tag's"
        required: true
      max_iters:
        description: "training iterations (sea/config/train_marola_gpt.py's default is 1000)"
        default: "1000"
      dry_run:
        description: "build and check everything, upload nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: marola-gpt-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag push publishes: its version is the tag's, and it must sit on main. By hand, the inputs.
      - name: The version, and whether this run uploads
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_MAX_ITERS: ${{ inputs.max_iters }}
        run: |
          if [ "$EVENT" = push ]; then
            version="${TAG#marola-gpt-v}" dry_run=false max_iters=1000
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::$TAG is not on main; only a commit of main is published"; exit 1; }
          else
            version="$IN_VERSION" dry_run="$IN_DRY_RUN" max_iters="$IN_MAX_ITERS"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z, not $version"; exit 1; }
          [[ "$max_iters" =~ ^[0-9]+$ ]] || { echo "::error::max_iters must be a number"; exit 1; }
          echo "marola-gpt $version: max_iters $max_iters, dry_run $dry_run"
          { echo "version=$version"; echo "dry_run=$dry_run"; echo "max_iters=$max_iters"; } >> "$GITHUB_OUTPUT"

      - name: Python with sea/requirements.txt (torch for the CPU)
        run: |
          python3 -m venv .tmp/venv
          .tmp/venv/bin/pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          .tmp/venv/bin/pip install --quiet -r sea/requirements.txt

      - name: The pinned corpus, as nanoGPT's dataset
        run: |
          scripts/corpus-fetch.sh
          .tmp/venv/bin/python sea/prepare_corpus.py

      - name: Train marola-gpt from random weights
        env:
          MAX_ITERS: ${{ steps.plan.outputs.max_iters }}
        run: |
          cd sea/nanogpt
          ../../.tmp/venv/bin/python train.py ../config/train_marola_gpt.py \
            --max_iters="$MAX_ITERS" --lr_decay_iters="$MAX_ITERS"

      - name: The release directory
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: .tmp/venv/bin/python sea/package.py --version "$VERSION"

      - name: Upload to Hugging Face (a tag push, or by hand with dry_run off)
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          DRY_RUN: ${{ steps.plan.outputs.dry_run }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            .tmp/venv/bin/python sea/publish_hf.py --version "$VERSION"
          else
            [ -n "${HF_TOKEN:-}" ] || { echo "::error::the HF_TOKEN secret is not set"; exit 1; }
            .tmp/venv/bin/python sea/publish_hf.py --version "$VERSION" --yes
          fi
