name: marola-local (the fine-tuned model as an image, gated by the benchmark)

# MIP-0008 §5.3 — LLMOps in the small: the model is versioned like the code. MIP-0070 §5.4: the
# benchmark is the pinned app image's `--benchmark` (marola-image), never an app build here, and the
# gate checks the run against the question set in the pinned resources tarball (resources.version).

on:
  push:
    branches: [main]
    paths:
      - "finetune/Modelfile"
      - "Dockerfile.local"
      - "marola-image"
      - "resources.version"
      - "scripts/app-image.sh"
      - "scripts/benchmark.sh"
      - "scripts/resources-fetch.sh"
      - "scripts/benchmark_gate.py"
      - "docs/benchmarks/**"
      - ".github/workflows/docker-local.yml"
  workflow_dispatch:
    inputs:
      tolerance:
        description: "How far below the best kept rag-general coverage the new run may be"
        type: string
        default: "0.05"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-local
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/marola-ml

jobs:
  build-gate-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.local

      - uses: docker/setup-buildx-action@v4
      # Also pulls the app image: ghcr.io/marola-dev/marola-app is a private package, so it has to grant
      # this repo read access (package settings, "Manage Actions access") for GITHUB_TOKEN.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=raw,value=local-{{sha}}
      - name: Build and push :local-<sha> (the candidate)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.local
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=local
          cache-to: type=gha,scope=local,mode=max

      - name: Start the candidate
        run: |
          docker run -d --name ollama-local -p 11434:11434 "$IMAGE:local-${GITHUB_SHA::7}"
          for _ in $(seq 1 60); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 2; done
          tags="$(curl -s http://localhost:11434/api/tags)"
          grep -q marola-llama3.2 <<<"$tags" && grep -q nomic-embed-text <<<"$tags"

      - name: The pinned app image (marola-image)
        id: app
        run: echo "ref=$(scripts/app-image.sh)" >>"$GITHUB_OUTPUT"
      - name: Pull it
        env:
          APP_IMAGE: ${{ steps.app.outputs.ref }}
        run: |
          for attempt in 1 2; do
            if docker pull -q "$APP_IMAGE"; then exit 0; fi
            echo "docker pull attempt $attempt failed"
            [ "$attempt" -eq 2 ] || sleep 60
          done
          exit 1
      - name: The pinned resources tarball (resources.version), for the gate's question set
        run: scripts/resources-fetch.sh

      # The image answers from its own /app/knowledge and embeds with the nomic-embed-text the
      # candidate carries; benchmark.sh fails here when the app reports a failure or saves no report.
      - name: --benchmark, the pinned app image against the candidate
        env:
          MAROLA_APP_IMAGE: ${{ steps.app.outputs.ref }}
        run: scripts/benchmark.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ github.run_id }}
          path: data/benchmark-*.md

      - name: Gate — compare with docs/benchmarks/, on the pinned question set
        env:
          TOLERANCE: ${{ inputs.tolerance || '0.05' }}
        run: |
          python3 scripts/benchmark_gate.py check --new data --kept docs/benchmarks \
            --questions .tmp/resources/benchmark_questions.json --tolerance "$TOLERANCE"

      - name: Promote — move :local to this build
        run: |
          docker tag "$IMAGE:local-${GITHUB_SHA::7}" "$IMAGE:local"
          docker push "$IMAGE:local"
